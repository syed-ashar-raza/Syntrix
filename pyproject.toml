[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntrix"
version = "0.1.0"
description = "Multimodal AI research and engineering platform"
requires-python = ">=3.11,<3.15"
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "numpy>=2.0",
  "pillow>=10.0",
  "scikit-learn>=1.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "prometheus-client>=0.21",
  "pydantic>=2.10",
  "httpx>=0.28"
]

[project.optional-dependencies]
research = ["transformers>=4.50", "peft>=0.15", "safetensors>=0.5"]
tracking = ["mlflow>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
syntrix = "syntrix.cli:main"
